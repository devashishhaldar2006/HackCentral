services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackcentral_backend
    ports:
      - "${BACKEND_PORT:-7777}:7777"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7777/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackcentral_frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-hackcentral.me}
    volumes:
      - ${SSL_CERTS_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
