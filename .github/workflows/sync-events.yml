name: Sync External Events

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  sync-events:
    name: Fetch and Upsert Events
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Event Ingestion Script
        working-directory: backend
        env:
          MONGO_DB_URI: ${{ secrets.MONGO_DB_URI }}
        run: npm run sync:events
